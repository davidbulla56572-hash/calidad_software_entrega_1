<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Presupuesto para Viajes</title>
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <main class="contenedor">
      <h1>Calculadora de Presupuesto para Viajes</h1>

      <p class="descripcion">
        Ingresa los gastos estimados de tu viaje para calcular el presupuesto
        necesario.
      </p>

      <form id="formularioViaje" class="formulario">
        <div class="campo campo-completo">
          <label for="destino">Destino del viaje</label>
          <input
            type="text"
            id="destino"
            name="destino"
            placeholder="Ejemplo: Cartagena"
            required
          />
        </div>

        <div class="campo">
          <label for="numeroNoches">Número de noches</label>
          <input
            type="number"
            id="numeroNoches"
            name="numeroNoches"
            min="0"
            step="1"
            value="1"
            required
          />
        </div>

        <div class="campo">
          <label for="costoNoche">Hospedaje por noche</label>
          <input
            type="number"
            id="costoNoche"
            name="costoNoche"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="campo">
          <label for="transporte">Costo de transporte</label>
          <input
            type="number"
            id="transporte"
            name="transporte"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="campo">
          <label for="alimentacion">Costo estimado de alimentación</label>
          <input
            type="number"
            id="alimentacion"
            name="alimentacion"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="campo">
          <label for="actividades">Costo de actividades</label>
          <input
            type="number"
            id="actividades"
            name="actividades"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="campo">
          <label for="otrosGastos">Otros gastos</label>
          <input
            type="number"
            id="otrosGastos"
            name="otrosGastos"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="campo campo-completo">
          <label for="descuento">Cupón de descuento</label>
          <input
            type="number"
            id="descuento"
            name="descuento"
            min="0"
            step="0.01"
            value="0"
          />
        </div>

        <div class="botones">
          <button type="submit" id="btnCalcular">Calcular presupuesto</button>

          <button type="button" id="btnLimpiar">Limpiar formulario</button>
        </div>
      </form>

      <div id="mensaje"></div>

      <section id="resultados">
        <h2 id="tituloResultado">Resumen del presupuesto</h2>

        <div class="fila-resultado">
          <span>Costo total del hospedaje:</span>
          <strong id="resultadoHospedaje">$0</strong>
        </div>

        <div class="fila-resultado">
          <span>Subtotal:</span>
          <strong id="resultadoSubtotal">$0</strong>
        </div>

        <div class="fila-resultado">
          <span>Imprevistos (5%):</span>
          <strong id="resultadoImprevistos">$0</strong>
        </div>

        <div class="fila-resultado">
          <span>Descuento aplicado:</span>
          <strong id="resultadoDescuento">$0</strong>
        </div>

        <div class="fila-resultado resultado-total">
          <span>Presupuesto total:</span>
          <strong id="resultadoTotal">$0</strong>
        </div>
      </section>
    </main>

    <style>
      :root {
        --color-primary: #2563eb;
        --color-primary-dark: #1d4ed8;
        --color-primary-soft: #eff6ff;

        --color-success: #15803d;
        --color-success-bg: #f0fdf4;
        --color-success-border: #bbf7d0;

        --color-error: #b91c1c;
        --color-error-bg: #fef2f2;
        --color-error-border: #fecaca;

        --color-text: #172033;
        --color-text-secondary: #64748b;
        --color-border: #dbe2ea;
        --color-border-focus: #93c5fd;

        --color-background: #f4f7fb;
        --color-surface: #ffffff;
        --color-surface-secondary: #f8fafc;

        --radius-small: 8px;
        --radius-medium: 12px;
        --radius-large: 18px;

        --shadow-small: 0 2px 8px rgba(15, 23, 42, 0.05);
        --shadow-medium: 0 12px 30px rgba(15, 23, 42, 0.08);

        --transition: 0.2s ease;
      }

      /* =========================================================
   CONFIGURACIÓN GENERAL
   ========================================================= */

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;

        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: var(--color-text);

        background:
          radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.08),
            transparent 30%
          ),
          var(--color-background);
      }

      /* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

      .contenedor {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;

        padding: 38px 42px;

        background-color: var(--color-surface);

        border: 1px solid rgba(219, 226, 234, 0.8);
        border-radius: var(--radius-large);

        box-shadow: var(--shadow-medium);
      }

      /* =========================================================
   ENCABEZADO
   ========================================================= */

      h1 {
        margin: 0 0 10px;

        font-size: clamp(1.8rem, 4vw, 2.4rem);
        line-height: 1.15;
        letter-spacing: -0.03em;

        text-align: center;
        color: var(--color-text);
      }

      .descripcion {
        max-width: 650px;
        margin: 0 auto 36px;

        font-size: 1rem;
        line-height: 1.6;

        text-align: center;
        color: var(--color-text-secondary);
      }

      /* =========================================================
   FORMULARIO
   ========================================================= */

      .formulario {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 22px 20px;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .campo-completo {
        grid-column: 1 / -1;
      }

      /* =========================================================
   ETIQUETAS
   ========================================================= */

      label {
        font-size: 0.92rem;
        font-weight: 650;

        color: #334155;
      }

      /* =========================================================
   CAMPOS DE ENTRADA
   ========================================================= */

      input {
        width: 100%;
        min-height: 46px;

        padding: 11px 13px;

        font-family: inherit;
        font-size: 0.98rem;
        color: var(--color-text);

        background-color: var(--color-surface);

        border: 1px solid var(--color-border);
        border-radius: var(--radius-small);

        outline: none;

        transition:
          border-color var(--transition),
          box-shadow var(--transition),
          background-color var(--transition);
      }

      input::placeholder {
        color: #94a3b8;
      }

      input:hover {
        border-color: #b7c2d0;
      }

      input:focus {
        border-color: var(--color-primary);

        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);

        background-color: #ffffff;
      }

      /* Mejora visual para campos numéricos */

      input[type="number"] {
        font-variant-numeric: tabular-nums;
      }

      /* =========================================================
   BOTONES
   ========================================================= */

      .botones {
        grid-column: 1 / -1;

        display: flex;
        gap: 14px;

        margin-top: 8px;
      }

      button {
        min-height: 48px;
        flex: 1;

        padding: 12px 18px;

        font-family: inherit;
        font-size: 0.98rem;
        font-weight: 650;

        border: none;
        border-radius: 10px;

        cursor: pointer;

        transition:
          background-color var(--transition),
          color var(--transition),
          transform var(--transition),
          box-shadow var(--transition);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.25);
        outline-offset: 3px;
      }

      /* Botón principal */

      #btnCalcular {
        color: white;

        background: linear-gradient(135deg, var(--color-primary), #3b82f6);

        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
      }

      #btnCalcular:hover {
        background: linear-gradient(
          135deg,
          var(--color-primary-dark),
          var(--color-primary)
        );

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
      }

      /* Botón secundario */

      #btnLimpiar {
        color: #475569;

        background-color: #f1f5f9;

        border: 1px solid #e2e8f0;
      }

      #btnLimpiar:hover {
        color: #1e293b;
        background-color: #e8edf3;
      }

      /* =========================================================
   MENSAJES
   ========================================================= */

      #mensaje {
        display: none;

        margin-top: 24px;
        padding: 14px 16px;

        font-size: 0.94rem;
        line-height: 1.5;

        border-radius: var(--radius-small);
      }

      .mensaje-error {
        display: block !important;

        color: var(--color-error);

        background-color: var(--color-error-bg);

        border: 1px solid var(--color-error-border);
        border-left: 4px solid #ef4444;
      }

      .mensaje-exito {
        display: block !important;

        color: var(--color-success);

        background-color: var(--color-success-bg);

        border: 1px solid var(--color-success-border);
        border-left: 4px solid #22c55e;
      }

      /* =========================================================
   RESULTADOS
   ========================================================= */

      #resultados {
        display: none;

        margin-top: 32px;
        padding: 26px;

        background: linear-gradient(
          180deg,
          #fbfdff,
          var(--color-surface-secondary)
        );

        border: 1px solid var(--color-border);
        border-radius: var(--radius-medium);

        box-shadow: var(--shadow-small);
      }

      #resultados h2 {
        margin: 0 0 18px;

        font-size: 1.3rem;
        line-height: 1.3;

        color: var(--color-text);
      }

      /* =========================================================
   FILAS DE RESULTADOS
   ========================================================= */

      .fila-resultado {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;

        padding: 13px 0;

        font-size: 0.97rem;

        border-bottom: 1px solid #e9edf2;
      }

      .fila-resultado span {
        color: var(--color-text-secondary);
      }

      .fila-resultado strong {
        color: var(--color-text);

        font-size: 1rem;
        font-variant-numeric: tabular-nums;

        text-align: right;
      }

      .fila-resultado:last-child {
        border-bottom: none;
      }

      /* =========================================================
   TOTAL FINAL
   ========================================================= */

      .resultado-total {
        margin-top: 10px;
        padding: 18px;

        background-color: var(--color-primary-soft);

        border: 1px solid #dbeafe;
        border-radius: 10px;
      }

      .resultado-total span {
        font-size: 1rem;
        font-weight: 650;

        color: #1e40af;
      }

      .resultado-total strong {
        font-size: 1.35rem;

        color: var(--color-primary-dark);
      }

      /* =========================================================
   RESPONSIVE
   ========================================================= */

      @media (max-width: 700px) {
        body {
          padding: 20px 12px;
        }

        .contenedor {
          padding: 26px 20px;

          border-radius: 14px;
        }

        .descripcion {
          margin-bottom: 28px;

          font-size: 0.94rem;
        }

        .formulario {
          grid-template-columns: 1fr;

          gap: 18px;
        }

        .campo-completo {
          grid-column: 1;
        }

        .botones {
          grid-column: 1;

          flex-direction: column;
        }

        button {
          width: 100%;
        }

        #resultados {
          padding: 20px 16px;
        }

        .fila-resultado {
          align-items: flex-start;
        }
      }

      @media (max-width: 430px) {
        body {
          padding: 0;

          background-color: #ffffff;
        }

        .contenedor {
          min-height: 100vh;

          padding: 24px 16px;

          border: none;
          border-radius: 0;

          box-shadow: none;
        }

        h1 {
          font-size: 1.65rem;
        }

        .fila-resultado {
          flex-direction: column;

          gap: 5px;
        }

        .fila-resultado strong {
          text-align: left;
        }

        .resultado-total {
          padding: 16px;
        }
      }

      /* =========================================================
   ACCESIBILIDAD
   ========================================================= */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>

    <script>
      const formulario = document.getElementById("formularioViaje");
      const botonLimpiar = document.getElementById("btnLimpiar");
      const mensaje = document.getElementById("mensaje");
      const seccionResultados = document.getElementById("resultados");

      function obtenerDatosFormulario() {
        return {
          destino: document.getElementById("destino").value,
          numeroNoches: parseInt(document.getElementById("numeroNoches").value),
          costoNoche: parseFloat(document.getElementById("costoNoche").value),
          transporte: parseInt(document.getElementById("transporte").value),
          alimentacion: parseFloat(
            document.getElementById("alimentacion").value,
          ),
          actividades: parseInt(document.getElementById("actividades").value),
          otrosGastos: parseFloat(document.getElementById("otrosGastos").value),
          descuento: Number(document.getElementById("descuento").value),
        };
      }

      function validarDatos(datos) {
        if (datos.destino.trim() === "") {
          return {
            esValido: false,
            mensaje: "Debes ingresar un destino para el viaje.",
          };
        }

        if (isNaN(datos.numeroNoches) || datos.numeroNoches < 0) {
          return {
            esValido: false,
            mensaje: "El número de noches ingresado no es válido.",
          };
        }

        if (
          isNaN(datos.costoNoche) ||
          isNaN(datos.transporte) ||
          isNaN(datos.alimentacion) ||
          isNaN(datos.actividades) ||
          isNaN(datos.otrosGastos) ||
          isNaN(datos.descuento)
        ) {
          return {
            esValido: false,
            mensaje: "Todos los valores económicos deben ser numéricos.",
          };
        }

        if (
          datos.costoNoche < 0 ||
          datos.alimentacion < 0 ||
          datos.otrosGastos < 0
        ) {
          return {
            esValido: false,
            mensaje: "Algunos valores económicos ingresados no son válidos.",
          };
        }

        return {
          esValido: true,
          mensaje: "",
        };
      }

      function calcularHospedaje(numeroNoches, costoPorNoche) {
        return numeroNoches * costoPorNoche;
      }

      function calcularSubtotal(
        costoHospedaje,
        transporte,
        alimentacion,
        actividades,
        otrosGastos,
      ) {
        return (
          costoHospedaje + transporte + alimentacion + actividades + otrosGastos
        );
      }

      function calcularImprevistos(subtotal) {
        return (subtotal * 5) / 100;
      }

      function aplicarDescuento(subtotal, imprevistos, descuento) {
        return subtotal + imprevistos - descuento;
      }

      function calcularTotalFinal(totalCalculado) {
        if (totalCalculado < 0) {
          return 0;
        }

        return totalCalculado;
      }

      function formatearDinero(valor) {
        return "$" + valor.toFixed(0);
      }

      function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = "";

        if (tipo === "error") {
          mensaje.classList.add("mensaje-error");
        } else {
          mensaje.classList.add("mensaje-exito");
        }
      }

      function ocultarMensaje() {
        mensaje.textContent = "";
        mensaje.className = "";
        mensaje.style.display = "none";
      }

      function mostrarResultados(datos, resultados) {
        document.getElementById("tituloResultado").innerHTML =
          "Resumen del viaje a " + datos.destino;

        document.getElementById("resultadoHospedaje").textContent =
          formatearDinero(resultados.costoHospedaje);

        document.getElementById("resultadoSubtotal").textContent =
          formatearDinero(resultados.subtotal);

        document.getElementById("resultadoImprevistos").textContent =
          formatearDinero(resultados.imprevistos);

        document.getElementById("resultadoDescuento").textContent =
          formatearDinero(datos.descuento);

        document.getElementById("resultadoTotal").textContent = formatearDinero(
          resultados.totalFinal,
        );

        seccionResultados.style.display = "block";
      }

      function calcularPresupuesto(datos) {
        const costoHospedaje = calcularHospedaje(
          datos.numeroNoches,
          datos.costoNoche,
        );

        const subtotal = calcularSubtotal(
          costoHospedaje,
          datos.transporte,
          datos.alimentacion,
          datos.actividades,
          datos.otrosGastos,
        );

        const imprevistos = calcularImprevistos(subtotal);

        const totalCalculado = aplicarDescuento(
          subtotal,
          imprevistos,
          datos.descuento,
        );

        const totalFinal = calcularTotalFinal(totalCalculado);

        return {
          costoHospedaje: costoHospedaje,
          subtotal: subtotal,
          imprevistos: imprevistos,
          totalCalculado: totalCalculado,
          totalFinal: totalFinal,
        };
      }

      function procesarFormulario(evento) {
        evento.preventDefault();

        ocultarMensaje();

        const datos = obtenerDatosFormulario();
        const validacion = validarDatos(datos);

        if (!validacion.esValido) {
          mostrarMensaje(validacion.mensaje, "error");
          seccionResultados.style.display = "none";
          return;
        }

        const resultados = calcularPresupuesto(datos);

        mostrarResultados(datos, resultados);
        mostrarMensaje("Presupuesto calculado correctamente.", "exito");
      }

      function limpiarFormulario() {
        formulario.reset();
        document.getElementById("numeroNoches").value = 1;
        document.getElementById("descuento").value = 0;
      }

      formulario.addEventListener("submit", procesarFormulario);
      botonLimpiar.addEventListener("click", limpiarFormulario);
    </script>
  </body>
</html>
